<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="agenda.css">
    <title>Agenda</title>
</head>
<body>
    <div class="container">
    <header>
        <img src="agendaicon.png" alt="agenda">
        <h1>Agenda Rápida</h1>
    </header>

    <form id="formulario">
        <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome-1" name="nome" required placeholder="Nome">
        </div>

        <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone-1" min="11" max="12" required placeholder="(99) 99999-9999">
        </div>
        
        <button type="submit">Cadastrar</button>
    </form>

    <h2>Lista de Contatos</h2>

    <table cellspacing="0">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Telefone</th>
            </tr>
        </thead>
        <tbody>
          
        </tbody>
    </table>
    </div>
    
    <script src="agenda.JS"></script>
</body>
</html>
